name: Deploy Activities

on:
  push:
    branches: [main]
    paths:
      - 'modules/activities/**'
      - 'packages/shared/**'
      - 'tsconfig.base.json'
      - '.github/workflows/deploy-activities.yml'
  workflow_dispatch:

concurrency:
  group: deploy-activities-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      STAGE: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Lint & typecheck
        run: |
          npm run lint
          npm run typecheck
      - name: Unit tests
        run: npm run test:unit -- --roots packages/shared modules/activities
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
      - name: Deploy activities module
        working-directory: modules/activities
        run: npx serverless deploy --stage $STAGE
      - name: Validate deploy isolation
        run: |
          echo "Recent tenants/users Lambda updates should be unchanged after this deploy:"
          aws lambda list-functions --query "Functions[?starts_with(FunctionName, 'todolist-')].{Name:FunctionName, LastModified:LastModified}" --output table
