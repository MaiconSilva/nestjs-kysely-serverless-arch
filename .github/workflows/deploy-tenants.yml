name: Deploy Tenants

on:
  push:
    branches: [main]
    paths:
      - 'modules/tenants/**'
      - 'packages/shared/**'
      - 'tsconfig.base.json'
      - '.github/workflows/deploy-tenants.yml'
  workflow_dispatch:

concurrency:
  group: deploy-tenants-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      STAGE: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Lint & typecheck
        run: |
          npm run lint
          npm run typecheck
      - name: Unit tests
        run: npm run test:unit -- --roots packages/shared modules/tenants
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
      - name: Run DB migrations
        run: npm run db:migrate
        env:
          PG_HOST: ${{ secrets.PG_HOST }}
          PG_PASSWORD: ${{ secrets.PG_PASSWORD }}
      - name: Deploy tenants module
        working-directory: modules/tenants
        run: npx serverless deploy --stage $STAGE
