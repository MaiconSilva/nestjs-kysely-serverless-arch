name: Deploy Users

on:
  push:
    branches: [main]
    paths:
      - 'modules/users/**'
      - 'packages/shared/**'
      - 'tsconfig.base.json'
      - '.github/workflows/deploy-users.yml'
  workflow_dispatch:

concurrency:
  group: deploy-users-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      STAGE: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Lint & typecheck
        run: |
          npm run lint
          npm run typecheck
      - name: Unit tests
        run: npm run test:unit -- --roots packages/shared modules/users
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
      - name: Deploy users module
        working-directory: modules/users
        run: npx serverless deploy --stage $STAGE
