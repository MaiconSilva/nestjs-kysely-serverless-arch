service: todolist-activities

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs20.x
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'us-east-1'}
  memorySize: 512
  timeout: 15
  architecture: arm64
  environment:
    NODE_OPTIONS: --enable-source-maps
    STAGE: ${sls:stage}
    PG_HOST: ${env:PG_HOST, param:PG_HOST}
    PG_PORT: ${env:PG_PORT, param:PG_PORT}
    PG_DATABASE: ${env:PG_DATABASE, param:PG_DATABASE}
    PG_USER: ${env:PG_USER, param:PG_USER}
    PG_PASSWORD: ${env:PG_PASSWORD, param:PG_PASSWORD}
    PG_MAX_CONNECTIONS: '2'
    AUTH_MODE: ${env:AUTH_MODE, 'cognito'}
    COGNITO_USER_POOL_ID: ${env:COGNITO_USER_POOL_ID, param:COGNITO_USER_POOL_ID}
    COGNITO_CLIENT_ID: ${env:COGNITO_CLIENT_ID, param:COGNITO_CLIENT_ID}
    JWT_LOCAL_SECRET: ${env:JWT_LOCAL_SECRET, 'local-dev-secret'}

plugins:
  - serverless-plugin-typescript
  - serverless-offline

custom:
  serverless-offline:
    httpPort: 3003
    lambdaPort: 3103

params:
  default:
    PG_HOST: localhost
    PG_PORT: '5432'
    PG_DATABASE: todo_dev
    PG_USER: todo
    PG_PASSWORD: todo123
    COGNITO_USER_POOL_ID: dummy
    COGNITO_CLIENT_ID: dummy

  local:
    PG_HOST: localhost
    PG_PORT: '5432'
    PG_DATABASE: todo_dev
    PG_USER: todo
    PG_PASSWORD: todo123
    COGNITO_USER_POOL_ID: dummy
    COGNITO_CLIENT_ID: dummy

package:
  individually: true
  patterns:
    - 'src/**'
    - '../../packages/shared/dist/**'
    - '../../tsconfig.base.json'

functions:
  createActivity:
    handler: src/presentation/handlers/activities-handler.handler
    events:
      - httpApi:
          path: /activities
          method: POST
  listActivities:
    handler: src/presentation/handlers/activities-handler.handler
    events:
      - httpApi:
          path: /activities
          method: GET
  assignActivity:
    handler: src/presentation/handlers/activities-handler.handler
    events:
      - httpApi:
          path: /activities/{id}/assign
          method: POST
  completeActivity:
    handler: src/presentation/handlers/activities-handler.handler
    events:
      - httpApi:
          path: /activities/{id}/complete
          method: POST
