service: todolist-users

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs20.x
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'us-east-1'}
  memorySize: 512
  timeout: 15
  architecture: arm64
  environment:
    NODE_OPTIONS: --enable-source-maps
    STAGE: ${self:provider.stage}
    PG_HOST: ${ssm:/todolist/${self:provider.stage}/pg/host}
    PG_PORT: ${ssm:/todolist/${self:provider.stage}/pg/port}
    PG_DATABASE: ${ssm:/todolist/${self:provider.stage}/pg/database}
    PG_USER: ${ssm:/todolist/${self:provider.stage}/pg/user}
    PG_PASSWORD: ${ssm:/todolist/${self:provider.stage}/pg/password, 'todo123'}
    PG_MAX_CONNECTIONS: '2'
    AUTH_MODE: ${env:AUTH_MODE, 'cognito'}
    COGNITO_USER_POOL_ID: ${ssm:/todolist/${self:provider.stage}/cognito/user-pool-id}
    COGNITO_CLIENT_ID: ${ssm:/todolist/${self:provider.stage}/cognito/client-id}
    COGNITO_ENDPOINT: ${env:COGNITO_ENDPOINT, ''}
    JWT_LOCAL_SECRET: ${env:JWT_LOCAL_SECRET, 'local-dev-secret'}
  iamRoleStatements:
    - Effect: Allow
      Action:
        - cognito-idp:AdminCreateUser
        - cognito-idp:AdminInitiateAuth
        - cognito-idp:AdminSetUserPassword
        - cognito-idp:AdminUpdateUserAttributes
      Resource: "*"

plugins:
  - serverless-plugin-typescript
  - serverless-offline

custom:
  serverless-offline:
    httpPort: 3002
    lambdaPort: 3102

package:
  individually: true
  patterns:
    - 'src/**'
    - '../../packages/shared/src/**'
    - '../../tsconfig.base.json'

functions:
  login:
    handler: src/presentation/handlers/users.handler.handler
    events:
      - httpApi:
          path: /auth/login
          method: POST
  createUser:
    handler: src/presentation/handlers/users.handler.handler
    events:
      - httpApi:
          path: /users
          method: POST
  listUsers:
    handler: src/presentation/handlers/users.handler.handler
    events:
      - httpApi:
          path: /users
          method: GET
